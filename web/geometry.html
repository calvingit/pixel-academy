<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>几何建筑师 · Pixel Academy</title>
  <link rel="stylesheet" href="/geometry.css">
  <script>
    // 主模块加载失败兜底（与其他游戏同口径）：保持不可玩并提示，不假装正常。
    window.__geometryBootFailed = setTimeout(function () {
      var el = document.getElementById('boot-fail');
      if (el) el.hidden = false;
    }, 6000);
  </script>
</head>
<body>
  <main id="app" class="app">
    <h1 class="app-title">几何建筑师<span class="app-title-dot">·</span></h1>

    <section id="screen-select" class="screen">
      <div class="profile-bar">
        <span class="profile-name">认图形、分一分、搭一搭</span>
        <a class="btn-ghost" href="/">返回数字消除</a>
      </div>
      <div class="card">
        <h2>选择练习年级</h2>
        <p class="hint">可多选 · 当前开放一年级数学</p>
        <div id="grade-grid" class="grade-grid" role="group" aria-label="年级多选"></div>
        <button id="btn-start" class="btn-primary" disabled>开始搭建 →</button>
        <p id="availability-status" class="availability" role="status"></p>
        <p id="storage-notice" class="storage-notice" hidden>本地存储不可用，本次练习不会保存记录，游戏仍可正常游玩。</p>
      </div>
      <p id="restore-incompatible" class="storage-notice" hidden>发现旧版本的练习进度，与当前内容不兼容，已安全放弃，不影响其他游戏数据。</p>
      <div id="restore-offer" class="card restore" hidden>
        <p id="restore-offer-text">有未完成的搭建任务，可以继续。</p>
        <div class="restore-actions">
          <button id="btn-restore" class="btn-primary">继续搭建</button>
          <button id="btn-discard-round" class="btn-ghost">放弃上局</button>
        </div>
      </div>
      <div class="card">
        <h2>练习记录</h2>
        <ul id="records-list" class="records"></ul>
        <p id="records-empty" class="hint">还没有练习记录。</p>
      </div>
    </section>

    <section id="screen-game" class="screen" hidden>
      <div class="game-hud">
        <button id="btn-game-return" class="btn-ghost">返回</button>
        <span id="hud-progress" class="hud-progress">第 1/5 个任务</span>
        <span id="hud-score" class="hud-score">得分 0</span>
        <button id="btn-pause" class="btn-ghost" aria-pressed="false">暂停</button>
      </div>
      <div id="question-card" class="card question">
        <p class="q-head"><span id="q-mode" class="mode-chip"></span></p>
        <p id="q-prompt" class="q-prompt"></p>
        <div id="choose-area" hidden>
          <p class="group-label">图形</p>
          <img id="choose-figure" class="choose-figure" alt="待辨认的立体图形">
          <p class="group-label">名称</p>
          <div id="choose-options" class="choose-options" role="group" aria-label="名称候选"></div>
        </div>
        <div id="place-area" hidden>
          <p id="place-hint" class="hint"></p>
          <p class="group-label">积木栏</p>
          <div id="blocks-shelf" class="blocks-shelf" role="group" aria-label="积木栏"></div>
          <p class="group-label" id="zones-label">格子</p>
          <div id="zones" class="zones" role="group" aria-label="放置格子（点选或拖入）"></div>
          <button id="btn-submit" class="btn-primary" hidden>提交</button>
        </div>
        <div id="feedback" class="feedback" role="status" hidden></div>
      </div>
    </section>

    <section id="screen-result" class="screen" hidden>
      <div class="card result">
        <h2>本局搭建完成！</h2>
        <p id="result-score" class="result-score"></p>
        <p id="result-answer" class="result-line"></p>
        <p id="result-modes" class="result-line"></p>
        <div class="restore-actions">
          <button id="btn-again" class="btn-primary">再来一局</button>
          <button id="btn-result-return" class="btn-ghost">返回选择</button>
        </div>
      </div>
    </section>

    <div id="pause-overlay" class="pause-overlay" hidden>
      <div class="pause-card">
        <p>工地中途休息</p>
        <button id="btn-resume" class="btn-primary">继续搭建</button>
      </div>
    </div>

    <dialog id="confirm-dialog" class="confirm-dialog">
      <p id="confirm-text">确定吗？</p>
      <div class="restore-actions">
        <button id="btn-confirm-yes" class="btn-primary" value="yes">确定</button>
        <button id="btn-confirm-no" class="btn-ghost" value="no">取消</button>
      </div>
    </dialog>

    <div id="boot-fail" class="boot-fail" hidden>页面资源加载失败，请刷新重试。</div>
  </main>
  <script type="module" src="/dist/game/geometry-builder/main.js"></script>
</body>
</html>
