<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#232135">
  <title>数字消除 · Pixel Academy</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/dist/game/number-puzzle/main.js"></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>数字消除</h1>
      <p class="app-subtitle">点选与题目答案相同的数字块</p>
    </header>

    <p id="offline-notice" class="status offline-notice" hidden></p>

    <p id="storage-notice" class="status status-warning storage-notice" hidden>
      本地存储不可用，练习记录与设置无法保存，游戏仍可正常游玩。
    </p>

    <section id="screen-error" class="screen" hidden>
      <p id="error-message" class="status status-warning">内容数据校验失败，游戏无法启动。</p>
    </section>

    <section id="screen-select" class="screen" hidden>
      <h2>选择年级</h2>
      <p id="select-open-hint" class="hint"></p>
      <fieldset class="grades">
        <legend>年级（可多选）</legend>
        <label><input type="checkbox" name="grade" value="1">一年级</label>
        <label><input type="checkbox" name="grade" value="2">二年级</label>
        <label><input type="checkbox" name="grade" value="3">三年级</label>
        <label><input type="checkbox" name="grade" value="4">四年级</label>
        <label><input type="checkbox" name="grade" value="5">五年级</label>
        <label><input type="checkbox" name="grade" value="6">六年级</label>
      </fieldset>
      <p id="select-empty-hint" class="hint" hidden>请先选择至少一个年级。</p>
      <div class="actions">
        <button id="btn-to-availability" type="button" class="primary" disabled>查看可用内容</button>
      </div>
      <div id="restore-offer" class="restore-offer" hidden>
        <p id="restore-offer-text" class="restore-text"></p>
        <div class="actions">
          <button id="btn-restore" type="button" class="primary">继续上局</button>
          <button id="btn-discard-round" type="button">放弃上局</button>
        </div>
      </div>
      <p id="restore-status" class="status" hidden></p>
      <div id="records-section" class="records">
        <h2>练习记录</h2>
        <p class="hint">保存在本机浏览器，可随时清除。</p>
        <ul id="records-list" class="records-list"></ul>
        <p id="records-empty" class="hint">暂无已保存的练习记录。</p>
        <div class="actions">
          <button id="btn-clear-records" type="button">清除本地记录</button>
        </div>
      </div>
    </section>

    <section id="screen-availability" class="screen" hidden>
      <h2>可用内容</h2>
      <p id="availability-status" class="status"></p>
      <div class="actions">
        <button id="btn-back-select" type="button">返回调整年级</button>
        <button id="btn-start" type="button" class="primary">开始一局</button>
      </div>
    </section>

    <section id="screen-game" class="screen screen-game" hidden>
      <p id="preview-banner" class="preview-banner" hidden>候选内容预览 · 练习未审核</p>
      <div class="game-top">
        <button id="btn-sound" type="button" class="chip" aria-pressed="true">音效 开</button>
      </div>
      <div id="board-wrap" class="board-wrap">
        <canvas id="board-canvas" class="board-canvas"></canvas>
        <div id="pause-overlay" class="pause-overlay" hidden>
          <p class="pause-title">⏸ 已暂停</p>
          <p class="pause-hint">进度已保留，随时继续。</p>
          <button id="btn-resume" type="button" class="primary">继续游戏</button>
        </div>
      </div>
      <div class="actions game-actions">
        <button id="btn-pause" type="button">暂停</button>
        <button id="btn-restart" type="button">重新开始</button>
        <button id="btn-game-return" type="button">返回</button>
      </div>
    </section>

    <section id="screen-result" class="screen" hidden>
      <h2>本局完成！</h2>
      <p id="result-preview-note" class="preview-banner" hidden>候选预览局 · 结果不计入正式记录</p>
      <p id="result-score" class="result-line"></p>
      <p id="result-first-try" class="result-line"></p>
      <p id="result-wrong" class="result-line"></p>
      <div class="actions">
        <button id="btn-again" type="button" class="primary">再来一局</button>
        <button id="btn-return" type="button">返回年级选择</button>
      </div>
    </section>
  </main>
  <script>
    // 离线资源缺失兜底（PLAN.md M6）：主模块加载失败（如离线且缓存未完成、
    // 缓存被部分清理）时 boot 不会执行、启动标记不会被置位；load 事件后仍无
    // 标记则给出可理解的提示，不承诺离线可玩。
    window.addEventListener('load', function () {
      if (window.__pixelAcademyBooted) return;
      var el = document.getElementById('offline-notice');
      if (!el) return;
      el.hidden = false;
      el.classList.add('status-warning');
      el.textContent = !navigator.onLine
        ? '当前处于离线状态，页面资源未完整缓存，无法开始游戏。请联网后打开本页，等待离线缓存完成后再离线使用。'
        : '页面资源加载失败，请刷新重试。';
    });
  </script>
</body>
</html>
